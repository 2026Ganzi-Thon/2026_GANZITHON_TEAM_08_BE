spring:
  application:
    name: ganzithon-team08
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  image:
    storage-dir: ${IMAGE_STORAGE_DIR:./data/images}
    python: ${IMAGE_PYTHON_EXECUTABLE:python3}
    max-pixels: ${IMAGE_MAX_PIXELS:24000000}
  privacy:
    legacy-enabled: ${PRIVACY_LEGACY_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  admin-key: ${KAKAO_ADMIN_KEY:}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  frontend-onboarding-path: ${KAKAO_ONBOARDING_PATH:/onboarding}
  frontend-home-path: ${KAKAO_HOME_PATH:/home}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
